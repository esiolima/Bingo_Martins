<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo · Painel do administrador</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Outfit:wght@400;500;600;700;800&display=swap');:root{--forest:#173a2c;--lime:#d8f26a;--paper:#f7f5ed;--ink:#172019;--muted:#718070;--line:#dfe4d9}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Outfit;color:var(--ink)}header{height:76px;background:var(--forest);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1120px)/2))}.brand{font-size:24px;font-weight:800}.brand i{color:var(--lime);font-style:normal}.user{font-size:14px;display:flex;gap:10px;align-items:center}.ava{width:32px;height:32px;background:var(--lime);border-radius:50%;display:grid;place-items:center;color:var(--forest);font-weight:bold}main{max-width:1120px;margin:auto;padding:42px 22px}h1{font-size:36px;letter-spacing:-1.6px;margin:0}p{color:var(--muted)}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.new{background:var(--lime);border:0;border-radius:9px;padding:13px 17px;font:600 14px Outfit;color:var(--forest);cursor:pointer}.grid{display:grid;grid-template-columns:380px 1fr;gap:23px}.box{background:#fffefa;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 2px 0 #e8ebe3}h2{margin:0 0 18px;font-size:20px}label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}input,select{width:100%;border:1px solid #ced8cd;border-radius:8px;padding:11px;font:14px Outfit;background:white;color:var(--ink)}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toggle{display:flex;align-items:center;gap:8px;font-size:13px;margin:16px 0}.toggle input{width:auto;accent-color:#196b48}.room{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;align-items:center;gap:15px;margin-bottom:12px}.code{font:12px 'DM Mono';color:#47745b;background:#e7f0df;padding:7px 8px;border-radius:5px}.room h3{margin:0 0 5px;font-size:17px}.room p{margin:0;font-size:13px}.room>div:nth-child(2){flex:1}.link{border:1px solid #b8ceb4;background:#fff;padding:9px 11px;border-radius:7px;font:12px 'DM Mono';max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.copy{border:0;background:var(--forest);color:white;border-radius:7px;padding:10px 12px;font:600 12px Outfit;cursor:pointer}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.badge{font-size:12px;background:#e2f3cb;color:#276443;padding:6px 8px;border-radius:20px}@media(max-width:760px){.grid{grid-template-columns:1fr}.intro{align-items:start;gap:14px}.intro h1{font-size:28px}.room{align-items:start;flex-wrap:wrap}.link{max-width:100%}}
</style></head><body><header><div class="brand">BINGO<i>·</i>AO VIVO</div><div class="user">Marina · administrador <div class="ava">M</div></div></header><main><div class="intro"><div><h1>Suas salas</h1><p>Crie uma sala e compartilhe o link com seus participantes.</p></div></div><div class="grid"><section class="box"><h2>Nova sala</h2><form onsubmit="createRoom(event)"><label>Nome da sala</label><input id="name" required placeholder="Ex.: Bingo de sexta-feira"><div class="options"><div><label>Máx. jogadores</label><select id="max"><option>10</option><option selected>20</option><option>50</option></select></div><div><label>Cartelas por pessoa</label><select id="cards"><option selected>1</option><option>2</option><option>3</option></select></div></div><label>Condição de vitória</label><select id="win"><option value="one_line">1 linha</option><option value="two_lines">2 linhas</option><option value="full_card">Cartela cheia</option></select><label class="toggle"><input id="plays" type="checkbox" checked> Também quero jogar nesta sala</label><button class="new" type="submit">Criar sala e gerar link</button></form></section><section class="box"><h2>Salas ativas</h2><div id="rooms"></div></section></div></main><script>
const key='bingoRoomsV1';const rooms=()=>JSON.parse(localStorage.getItem(key)||'[]');function code(){return 'BINGO-'+Math.random().toString(36).slice(2,6).toUpperCase()}function createRoom(e){e.preventDefault();let r={code:code(),name:name.value,max:+max.value,cards:+cards.value,win:win.value,plays:plays.checked,created:new Date().toISOString()};localStorage.setItem(key,JSON.stringify([r,...rooms()]));render()}function share(c){let u=new URL('bingo-sala.html?room='+c,location.href).href;navigator.clipboard?.writeText(u);alert('Link copiado!\n\n'+u)}function render(){let rs=rooms(),el=document.getElementById('rooms');el.innerHTML=rs.length?rs.map(r=>{let url='bingo-sala.html?room='+r.code;return '<div class="room"><div class="code">'+r.code+'</div><div><h3>'+r.name+'</h3><p>'+r.max+' participantes · '+r.cards+' cartela(s) · '+({one_line:'1 linha',two_lines:'2 linhas',full_card:'cartela cheia'}[r.win])+'</p></div><span class="badge">Aguardando</span><div class="link">'+url+'</div><button class="copy" onclick="share(\''+r.code+'\')">Copiar link</button></div>'}).join(''):'<div class="empty">Nenhuma sala criada ainda.<br>Use o formulário ao lado para começar.</div>'}render();
</script></body></html>
