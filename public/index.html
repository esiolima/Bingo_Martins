<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo ao vivo</title><style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');:root{--f:#173a2c;--l:#d8f26a;--p:#f7f5ed;--i:#172019;--m:#718070;--bd:#dfe4d9}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:Outfit;color:var(--i)}header{height:70px;background:var(--f);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1100px)/2))}.logo{font-size:22px;font-weight:800}.logo b{color:var(--l)}main{max-width:1100px;margin:auto;padding:38px 20px}.box{max-width:510px;margin:0 auto;background:#fffefa;border:1px solid var(--bd);border-radius:16px;padding:28px;box-shadow:0 5px 20px #173a2c10}.wide{max-width:none}h1{font-size:31px;margin:0 0 8px;letter-spacing:-1px}h2{margin:0 0 14px;font-size:20px}p{color:var(--m);line-height:1.45}.tab{display:flex;border-bottom:1px solid var(--bd);margin:22px 0 15px}.tab button{border:0;background:transparent;padding:10px 12px;font:600 14px Outfit;color:var(--m);cursor:pointer}.tab button.active{color:var(--f);border-bottom:2px solid var(--f)}label{display:block;font-size:13px;font-weight:600;margin:13px 0 5px}input,select{width:100%;padding:11px;border:1px solid #cbd5ca;border-radius:8px;background:white;font:14px Outfit}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:8px;padding:12px 15px;background:var(--f);color:var(--l);font:600 14px Outfit;cursor:pointer;margin-top:20px}.btn.alt{background:var(--l);color:var(--f)}.error{display:none;background:#fff0ee;color:#9d3934;padding:9px;border-radius:7px;font-size:13px;margin-top:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.small{font-size:13px}.rooms{display:grid;gap:12px}.room{border:1px solid var(--bd);padding:17px;border-radius:11px;display:flex;gap:12px;align-items:center}.room>div:first-child{flex:1}.room h3{margin:0 0 5px}.code{font:12px monospace;color:#396c4e}.link{font:12px monospace;padding:8px;background:#edf3e9;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.game{display:grid;grid-template-columns:1fr 330px;gap:20px}.ball{width:96px;height:96px;border-radius:50%;background:var(--l);display:grid;place-items:center;font-size:38px;font-weight:800;color:var(--f);margin:15px 0}.numbers{display:flex;flex-wrap:wrap;gap:7px}.n{width:33px;height:33px;border-radius:50%;border:1px solid #cad7c8;display:grid;place-items:center;font-size:12px}.card{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #ced8cd;border-radius:10px;overflow:hidden;max-width:550px}.cell{aspect-ratio:1;display:grid;place-items:center;border-right:1px solid #e3e8e1;border-bottom:1px solid #e3e8e1;font-weight:700;cursor:pointer}.cell.mark{background:#dff1bf}.cell.free{background:#f9dc9e;font-size:11px}.notice{padding:12px;border-radius:8px;background:#e4f1d2;color:#265c3b;margin:14px 0}.hidden{display:none}@media(max-width:700px){.game{grid-template-columns:1fr}.two{grid-template-columns:1fr}.room{flex-wrap:wrap}}
</style><body><header><div class="logo">BINGO<b>·</b>AO VIVO</div><span id="head">Jogue online com amigos</span></header><main id="app"></main><script src="/socket.io/socket.io.js"></script><script>
const A='/api',app=document.querySelector('#app'),state={admin:localStorage.adminToken,player:localStorage.playerToken,room:null,me:null};const esc=s=>String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));async function api(url,opt={}){let r=await fetch(A+url,{headers:{'Content-Type':'application/json',...(opt.token?{Authorization:'Bearer '+opt.token}:{})},...opt,body:opt.body?JSON.stringify(opt.body):undefined}),j=await r.json();if(!r.ok)throw Error(j.error);return j}function err(e){let x=document.querySelector('.error');if(x){x.textContent=e.message;x.style.display='block'}else alert(e.message)}function home(){let code=new URLSearchParams(location.search).get('room');if(code)return join(code);app.innerHTML='<section class="box"><span class="code">BINGO ONLINE</span><h1>Crie uma sala ou entre pelo seu link.</h1><p>O administrador controla o sorteio; cada participante recebe cartelas e conta próprias.</p><button class="btn alt" onclick="admin()">Acessar painel do administrador</button></section>'}
function admin(){if(state.admin)return dashboard();app.innerHTML='<section class="box"><h1>Painel do administrador</h1><div class="tab"><button class="active" onclick="authForm(\'login\')">Entrar</button><button onclick="authForm(\'register\')">Criar conta</button></div><div id="form"></div></section>';authForm('login')}function authForm(type){document.querySelectorAll('.tab button').forEach((b,i)=>b.classList.toggle('active',(type==='login')===!i));document.querySelector('#form').innerHTML='<form onsubmit="adminSubmit(event,\''+type+'\')">'+(type==='register'?'<label>Seu nome</label><input name="name" required>':'')+'<label>E-mail</label><input type="email" name="email" required><label>Senha</label><input type="password" name="password" minlength="6" required><div class="error"></div><button class="btn">'+(type==='login'?'Entrar':'Criar conta')+'</button></form>'}async function adminSubmit(e,type){e.preventDefault();try{let x=await api('/admin/'+type,{method:'POST',body:Object.fromEntries(new FormData(e.target))});state.admin=x.token;localStorage.adminToken=x.token;dashboard()}catch(x){err(x)}}
async function dashboard(){try{let rs=await api('/rooms',{token:state.admin});document.querySelector('#head').textContent='Administrador';app.innerHTML='<div class="top"><div><h1>Suas salas</h1><p>Crie uma sala e envie o link aos participantes.</p></div><button class="btn" style="margin:0" onclick="createRoom()">Nova sala</button></div><section class="box wide"><div class="rooms">'+(rs.length?rs.map(r=>'<div class="room"><div><h3>'+esc(r.name)+'</h3><span class="code">'+r.code+' · '+r.players+'/'+r.max_players+' participantes · '+(r.admin_plays?'admin joga · ':'')+r.status+'</span></div><div class="link">'+location.origin+'/?room='+r.code+'</div><button class="btn" style="margin:0" onclick="navigator.clipboard.writeText(location.origin+\'/?room='+r.code+'\');this.textContent=\'Copiado!\'">Copiar</button><button class="btn alt" style="margin:0" onclick="adminGame(\''+r.code+'\')">Abrir</button></div>').join(''):'<p>Nenhuma sala criada ainda.</p>')+'</div></section>'}catch(e){localStorage.removeItem('adminToken');state.admin=null;admin()}}function createRoom(){app.innerHTML='<section class="box"><h1>Nova sala</h1><form onsubmit="saveRoom(event)"><label>Nome da sala</label><input name="name" required placeholder="Bingo de sexta"><div class="two"><div><label>Máx. jogadores</label><input name="maxPlayers" type="number" value="20" min="1" max="200"></div><div><label>Cartelas por pessoa</label><select name="cards"><option>1</option><option>2</option><option>3</option></select></div></div><label>Condição de vitória</label><select name="win"><option value="one_line">1 linha</option><option value="two_lines">2 linhas</option><option value="full_card">Cartela cheia</option></select><label style="display:flex;gap:8px;align-items:center;margin-top:15px"><input style="width:auto" type="checkbox" name="adminPlays"> Quero jogar nesta sala também</label><div class="error"></div><button class="btn">Criar sala</button></form></section>'}async function saveRoom(e){e.preventDefault();try{let r=await api('/rooms',{method:'POST',token:state.admin,body:Object.fromEntries(new FormData(e.target))});adminGame(r.code)}catch(x){err(x)}}
async function adminGame(code){let [r,requests,players,mine]=await Promise.all([api('/rooms/'+code),api('/rooms/'+code+'/requests',{token:state.admin}),api('/rooms/'+code+'/players',{token:state.admin}),api('/rooms/'+code+'/my-player',{token:state.admin})]);state.room=r;state.adminPlayer=mine;watch(code);let myCard=mine?'<h2 style="margin-top:25px">Sua cartela</h2><div class="card">'+mine.player.cards[0].map(n=>'<div class="cell '+(n===null?'free':mine.player.marked.includes(n)?'mark':'')+'" onclick="adminMark('+n+')">'+(n===null?'FREE':n)+'</div>').join('')+'</div><button class="btn alt" onclick="adminBingo()">GRITAR BINGO!</button>':'';app.innerHTML='<div class="game"><section class="box wide"><span class="code">ADMIN · '+code+'</span><h1>'+esc(r.name)+'</h1><div class="ball">'+(r.drawn.at(-1)||'—')+'</div><p>'+r.drawn.length+' de 75 pedras sorteadas · Status: '+r.status+'</p><button class="btn" onclick="action(\''+code+'\',\'start\')">Iniciar</button> <button class="btn alt" onclick="action(\''+code+'\',\'draw\')">Sortear pedra</button> <button class="btn" onclick="action(\''+code+'\',\'restart\')">Reiniciar</button>'+myCard+'<h2 style="margin-top:25px">Pedidos de Bingo</h2>'+(requests.length?requests.map(q=>'<div class="notice">'+esc(q.name)+' · conferência automática: '+(q.valid?'válida':'inválida')+'<br><button class="btn" onclick="resolve(\''+q.id+'\',true)">Aprovar</button> <button class="btn alt" onclick="resolve(\''+q.id+'\',false)">Rejeitar</button></div>').join(''):'<p>Nenhum pedido pendente.</p>')+'</section><aside class="box"><h2>Participantes ('+players.length+')</h2>'+players.map(p=>'<p class="small">● '+esc(p.name)+(p.is_admin?' (admin)':'')+'</p>').join('')+'<h2>Link para participantes</h2><div class="link">'+location.origin+'/?room='+code+'</div><p class="small">Envie este link. Cada pessoa criará seu próprio acesso.</p><h2>Pedras</h2><div class="numbers">'+r.drawn.map(n=>'<div class="n">'+n+'</div>').join('')+'</div></aside></div>'}async function action(c,x){try{await api('/rooms/'+c+'/'+x,{method:'POST',token:state.admin});adminGame(c)}catch(e){alert(e.message)}}async function resolve(id,approve){await api('/requests/'+id+'/resolve',{method:'POST',token:state.admin,body:{approve}});adminGame(state.room.code)}async function adminMark(n){if(!n)return;try{let x=await api('/player/mark',{method:'POST',token:state.adminPlayer.token,body:{number:n}});state.adminPlayer.player.marked=x.marked;adminGame(state.room.code)}catch(e){alert(e.message)}}async function adminBingo(){try{let x=await api('/player/bingo',{method:'POST',token:state.adminPlayer.token,body:{}});alert(x.valid?'Pedido enviado para conferência.':'A conferência automática ainda não encontrou a condição de vitória.');adminGame(state.room.code)}catch(e){alert(e.message)}}
async function join(code){try{let r=await api('/rooms/'+code);state.room=r;if(state.player)return playerGame();app.innerHTML='<section class="box"><span class="code">'+code+'</span><h1>'+esc(r.name)+'</h1><p>Crie seu acesso ou entre novamente para receber sua cartela.</p><div class="tab"><button class="active" onclick="playerForm(\'join\')">Criar acesso</button><button onclick="playerForm(\'login\')">Entrar</button></div><div id="form"></div></section>';playerForm('join')}catch(e){app.innerHTML='<section class="box"><h1>Sala indisponível</h1><p>'+e.message+'</p></section>'}}function playerForm(type){document.querySelector('#form').innerHTML='<form onsubmit="playerSubmit(event,\''+type+'\')">'+(type==='join'?'<label>Nome</label><input name="name" required minlength="2">':'')+'<label>E-mail</label><input name="email" type="email" required><label>Senha</label><input name="password" type="password" minlength="6" required><div class="error"></div><button class="btn">'+(type==='join'?'Criar acesso e entrar':'Entrar')+'</button></form>'}async function playerSubmit(e,t){e.preventDefault();try{let x=await api('/rooms/'+state.room.code+'/'+t,{method:'POST',body:Object.fromEntries(new FormData(e.target))});state.player=x.token;state.me=x.player;state.room=x.room;localStorage.playerToken=x.token;playerGame()}catch(x){err(x)}}async function playerGame(){let r=await api('/rooms/'+state.room.code);state.room=r;watch(r.code);let me=state.me;if(!me){localStorage.removeItem('playerToken');state.player=null;return join(r.code)}let c=me.cards[0],marked=me.marked||[];app.innerHTML='<div class="game"><section class="box wide"><span class="code">SALA '+r.code+'</span><h1>'+esc(r.name)+'</h1><p>Status: '+r.status+' · Pedras: '+r.drawn.length+'/75</p><div class="card">'+c.map((n,i)=>'<div class="cell '+(n===null?'free':marked.includes(n)?'mark':'')+'" onclick="mark('+n+')">'+(n===null?'FREE':n)+'</div>').join('')+'</div><button class="btn alt" onclick="bingo()">GRITAR BINGO!</button></section><aside class="box"><h2>Última pedra</h2><div class="ball">'+(r.drawn.at(-1)||'—')+'</div><div class="numbers">'+r.drawn.map(n=>'<div class="n">'+n+'</div>').join('')+'</div></aside></div>'}async function mark(n){if(!n)return;try{let x=await api('/player/mark',{method:'POST',token:state.player,body:{number:n}});state.me.marked=x.marked;playerGame()}catch(e){alert(e.message)}}async function bingo(){try{let r=await api('/player/bingo',{method:'POST',token:state.player,body:{}});alert(r.valid?'Pedido enviado para conferência do administrador.':'Pedido enviado, mas a conferência automática indicou que a condição ainda não foi atendida.');playerGame()}catch(e){alert(e.message)}}let socket;function watch(c){if(socket)return;socket=io();socket.emit('room:join',c);socket.on('room:update',()=>setTimeout(()=>state.admin?adminGame(c):state.player?playerGame():null,350))}home();
</script><script>
function logoutPlayer(){if(!confirm('Deseja sair da sala? Você poderá entrar novamente com e-mail e senha.'))return;localStorage.removeItem('playerToken');state.player=null;state.me=null;socket?.disconnect();socket=null;join(state.room.code)}
const renderPlayerBase=playerGame;playerGame=async function(){await renderPlayerBase();let card=app.querySelector('.game .box.wide');if(card&&!card.querySelector('.logout')){let b=document.createElement('button');b.className='btn logout';b.style.marginLeft='10px';b.textContent='Sair da sala';b.onclick=logoutPlayer;card.querySelector('h1')?.after(b)}};
if(state.player)setTimeout(playerGame,0);
</script></body></html>
