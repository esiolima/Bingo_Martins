<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bingo ao vivo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
:root{--f:#173a2c;--f2:#24543d;--l:#d8f26a;--p:#f4f2e9;--i:#172019;--m:#718070;--bd:#dfe4d9;--white:#fffefa;--mark:#dff1bf;--free:#f9dc9e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#fbfaf4 0,#f4f2e9 55%,#ebe8dc 100%);font-family:Outfit;color:var(--i);min-height:100vh}
header{height:72px;background:linear-gradient(135deg,var(--f),var(--f2));color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1180px)/2));box-shadow:0 4px 18px #173a2c22;position:sticky;top:0;z-index:20}
.logo{font-size:22px;font-weight:800;letter-spacing:-.5px}.logo b{color:var(--l)}#head{font-size:13px;opacity:.85}
main{max-width:1180px;margin:auto;padding:34px 20px 60px}.box{max-width:510px;margin:0 auto;background:rgba(255,254,250,.96);border:1px solid var(--bd);border-radius:20px;padding:28px;box-shadow:0 10px 35px #173a2c10}.wide{max-width:none}h1{font-size:32px;margin:0 0 8px;letter-spacing:-1.2px}h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 5px}p{color:var(--m);line-height:1.45}.code{font:700 12px monospace;color:#396c4e;letter-spacing:.3px}.small{font-size:13px}
.tab{display:flex;border-bottom:1px solid var(--bd);margin:22px 0 15px}.tab button{border:0;background:transparent;padding:10px 12px;font:600 14px Outfit;color:var(--m);cursor:pointer}.tab button.active{color:var(--f);border-bottom:2px solid var(--f)}
label{display:block;font-size:13px;font-weight:600;margin:13px 0 5px}input,select{width:100%;padding:12px;border:1px solid #cbd5ca;border-radius:10px;background:white;font:14px Outfit;outline:none}input:focus,select:focus{border-color:var(--f);box-shadow:0 0 0 3px #173a2c12}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--f);color:var(--l);font:700 14px Outfit;cursor:pointer;margin-top:20px;transition:.15s transform,.15s box-shadow}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 15px #173a2c22}.btn.alt{background:var(--l);color:var(--f)}.btn.ghost{background:#eef2e9;color:var(--f)}
.error{display:none;background:#fff0ee;color:#9d3934;padding:10px;border-radius:8px;font-size:13px;margin-top:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.rooms{display:grid;gap:12px}.room{border:1px solid var(--bd);padding:17px;border-radius:14px;display:flex;gap:12px;align-items:center;background:white}.room>div:first-child{flex:1}.link{font:12px monospace;padding:9px;background:#edf3e9;border-radius:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}.game-main{display:flex;flex-direction:column;align-items:center}.game-header{width:100%;display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.status{display:inline-flex;align-items:center;gap:7px;background:#edf3e9;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;color:var(--f)}.status:before{content:'';width:7px;height:7px;border-radius:50%;background:#6b9c53}.ball{width:108px;height:108px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#f6ffb0 0,#d8f26a 42%,#a8c844 100%);display:grid;place-items:center;font-size:42px;font-weight:800;color:var(--f);margin:18px 0;box-shadow:0 12px 25px #173a2c20,inset -5px -8px 12px #6c842c22}
.numbers{display:flex;flex-wrap:wrap;gap:7px}.n{width:38px;height:38px;border-radius:50%;border:1px solid #cad7c8;background:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}.n.latest{background:var(--l);color:var(--f);border-color:#a7c64e}
.card-wrap{width:100%;max-width:560px;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:0 8px 24px #173a2c12}.card-title{display:grid;grid-template-columns:repeat(5,1fr);margin-bottom:8px;text-align:center;font-weight:800;font-size:16px;color:var(--f)}.card{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;aspect-ratio:1/1;border:2px solid var(--f);border-radius:13px;overflow:hidden;background:#fff}.cell{min-width:0;min-height:0;display:grid;place-items:center;border-right:1px solid #dce3d9;border-bottom:1px solid #dce3d9;font-size:clamp(21px,4vw,30px);font-weight:800;cursor:pointer;user-select:none;transition:.12s;background:#fff}.cell:nth-child(5n){border-right:0}.cell:nth-last-child(-n+5){border-bottom:0}.cell:hover{background:#f2f7ec}.cell.mark{background:var(--mark);color:var(--f);box-shadow:inset 0 0 0 3px #b9d77e}.cell.free{background:var(--free);font-size:clamp(12px,2vw,16px);color:#664b1c}
.notice{padding:14px;border-radius:11px;background:#e4f1d2;color:#265c3b;margin:14px 0}.notice button{margin-top:10px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-top:25px}.bingo-btn{width:100%;max-width:560px;font-size:17px;padding:15px 18px;letter-spacing:.3px}
.bingo-overlay{position:fixed;inset:0;background:rgba(13,30,22,.72);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.bingo-overlay.show{display:flex;animation:fadeIn .18s ease}.bingo-modal{width:min(760px,96vw);background:linear-gradient(145deg,#fffef6,#f0f7dd);border:3px solid var(--l);border-radius:28px;padding:48px 30px 40px;text-align:center;box-shadow:0 30px 90px #0007;position:relative;overflow:hidden;animation:pop .28s cubic-bezier(.2,.9,.2,1)}.bingo-modal:before,.bingo-modal:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:#d8f26a55;filter:blur(2px)}.bingo-modal:before{left:-90px;top:-90px}.bingo-modal:after{right:-90px;bottom:-90px}.bingo-kicker{font-size:14px;font-weight:800;letter-spacing:4px;color:#52723c;text-transform:uppercase;position:relative}.bingo-word{font-size:clamp(68px,13vw,132px);line-height:.9;font-weight:800;letter-spacing:-6px;color:var(--f);margin:18px 0 15px;position:relative;text-shadow:4px 5px 0 #d8f26a}.bingo-name{font-size:clamp(22px,4vw,34px);font-weight:700;color:var(--f);position:relative}.bingo-sub{font-size:15px;color:var(--m);position:relative}.bingo-close{position:relative;margin-top:24px}
.hidden{display:none}@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:700px){header{height:64px}#head{display:none}main{padding:22px 12px 40px}.game{grid-template-columns:1fr}.two{grid-template-columns:1fr}.room{flex-wrap:wrap}.room .link{width:100%}.box{padding:20px;border-radius:16px}.cell{font-size:clamp(18px,6vw,25px)}.card-wrap{padding:8px}.game-header{display:block}.status{margin-top:8px}}
</style>
</head>
<body>
<header><div class="logo">BINGO<b>·</b>AO VIVO</div><span id="head">Jogue online com amigos</span></header>
<main id="app"></main>
<div id="bingoOverlay" class="bingo-overlay" aria-hidden="true">
  <div class="bingo-modal" role="dialog" aria-modal="true">
    <div class="bingo-kicker">Temos um vencedor em análise</div>
    <div class="bingo-word">BINGO!</div>
    <div id="bingoName" class="bingo-name">Alguém gritou Bingo</div>
    <div class="bingo-sub">Atenção: o administrador está conferindo a cartela.</div>
    <button class="btn alt bingo-close" onclick="closeBingo()">Entendi</button>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const A='/api',app=document.querySelector('#app'),state={admin:localStorage.adminToken,player:localStorage.playerToken,room:null,me:null,adminPlayer:null};
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function api(url,opt={}){let r=await fetch(A+url,{headers:{'Content-Type':'application/json',...(opt.token?{Authorization:'Bearer '+opt.token}: {})},...opt,body:opt.body?JSON.stringify(opt.body):undefined}),j=await r.json();if(!r.ok)throw Error(j.error);return j}
function err(e){let x=document.querySelector('.error');if(x){x.textContent=e.message;x.style.display='block'}else alert(e.message)}
function showBingo(name){document.querySelector('#bingoName').textContent=name||'Um jogador';document.querySelector('#bingoOverlay').classList.add('show');document.querySelector('#bingoOverlay').setAttribute('aria-hidden','false')}
function closeBingo(){document.querySelector('#bingoOverlay').classList.remove('show');document.querySelector('#bingoOverlay').setAttribute('aria-hidden','true')}
function home(){let code=new URLSearchParams(location.search).get('room');if(code)return join(code);app.innerHTML='<section class="box"><span class="code">BINGO ONLINE</span><h1>Crie uma sala ou entre pelo seu link.</h1><p>O administrador controla o sorteio; cada participante recebe cartelas e conta próprias.</p><button class="btn alt" onclick="admin()">Acessar painel do administrador</button></section>'}
function admin(){if(state.admin)return dashboard();app.innerHTML='<section class="box"><h1>Painel do administrador</h1><div class="tab"><button class="active" onclick="authForm(\'login\')">Entrar</button><button onclick="authForm(\'register\')">Criar conta</button></div><div id="form"></div></section>';authForm('login')}
function authForm(type){document.querySelectorAll('.tab button').forEach((b,i)=>b.classList.toggle('active',(type==='login')===!i));document.querySelector('#form').innerHTML='<form onsubmit="adminSubmit(event,\''+type+'\')">'+(type==='register'?'<label>Seu nome</label><input name="name" required>':'')+'<label>E-mail</label><input type="email" name="email" required><label>Senha</label><input type="password" name="password" minlength="6" required><div class="error"></div><button class="btn">'+(type==='login'?'Entrar':'Criar conta')+'</button></form>'}
async function adminSubmit(e,type){e.preventDefault();try{let x=await api('/admin/'+type,{method:'POST',body:Object.fromEntries(new FormData(e.target))});state.admin=x.token;localStorage.adminToken=x.token;dashboard()}catch(x){err(x)}}
async function dashboard(){try{let rs=await api('/rooms',{token:state.admin});document.querySelector('#head').textContent='Administrador';app.innerHTML='<div class="top"><div><h1>Suas salas</h1><p>Crie uma sala e envie o link aos participantes.</p></div><button class="btn" style="margin:0" onclick="createRoom()">Nova sala</button></div><section class="box wide"><div class="rooms">'+(rs.length?rs.map(r=>'<div class="room"><div><h3>'+esc(r.name)+'</h3><span class="code">'+r.code+' · '+r.players+'/'+r.max_players+' participantes · '+(r.admin_plays?'admin joga · ':'')+r.status+'</span></div><div class="link">'+location.origin+'/?room='+r.code+'</div><button class="btn" style="margin:0" onclick="navigator.clipboard.writeText(location.origin+\'/?room='+r.code+'\');this.textContent=\'Copiado!\'">Copiar</button><button class="btn alt" style="margin:0" onclick="adminGame(\''+r.code+'\')">Abrir</button></div>').join(''):'<p>Nenhuma sala criada ainda.</p>')+'</div></section>'}catch(e){localStorage.removeItem('adminToken');state.admin=null;admin()}}
function createRoom(){app.innerHTML='<section class="box"><h1>Nova sala</h1><form onsubmit="saveRoom(event)"><label>Nome da sala</label><input name="name" required placeholder="Bingo de sexta"><div class="two"><div><label>Máx. jogadores</label><input name="maxPlayers" type="number" value="20" min="1" max="200"></div><div><label>Cartelas por pessoa</label><select name="cards"><option>1</option><option>2</option><option>3</option></select></div></div><label>Condição de vitória</label><select name="win"><option value="one_line">1 linha</option><option value="two_lines">2 linhas</option><option value="full_card">Cartela cheia</option></select><label style="display:flex;gap:8px;align-items:center;margin-top:15px"><input style="width:auto" type="checkbox" name="adminPlays"> Quero jogar nesta sala também</label><div class="error"></div><button class="btn">Criar sala</button></form></section>'}
async function saveRoom(e){e.preventDefault();try{let r=await api('/rooms',{method:'POST',token:state.admin,body:Object.fromEntries(new FormData(e.target))});adminGame(r.code)}catch(x){err(x)}}
function renderCard(cards,marked,clickFn){return '<div class="card-wrap"><div class="card-title"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div><div class="card">'+cards.map(n=>'<div class="cell '+(n===null?'free':marked.includes(n)?'mark':'')+'" '+(n===null?'':'onclick="'+clickFn+'('+n+')"')+'>'+ (n===null?'FREE':n)+'</div>').join('')+'</div></div>'}
function renderNumbers(drawn){return drawn.map((n,i)=>'<div class="n '+(i===drawn.length-1?'latest':'')+'">'+n+'</div>').join('')}
async function adminGame(code){let [r,requests,players,mine]=await Promise.all([api('/rooms/'+code),api('/rooms/'+code+'/requests',{token:state.admin}),api('/rooms/'+code+'/players',{token:state.admin}),api('/rooms/'+code+'/my-player',{token:state.admin})]);state.room=r;state.adminPlayer=mine;watch(code);let myCard=mine?'<div class="section-title"><h2>Sua cartela</h2><span class="status">Jogador administrador</span></div>'+renderCard(mine.player.cards[0],mine.player.marked||[],'adminMark')+'<button class="btn alt bingo-btn" onclick="adminBingo()">GRITAR BINGO!</button>':'';app.innerHTML='<div class="game"><section class="box wide game-main"><div class="game-header"><div><span class="code">ADMIN · '+code+'</span><h1>'+esc(r.name)+'</h1><span class="status">'+r.status+'</span></div><div class="code">'+r.drawn.length+' / 75 pedras</div></div><div class="ball">'+(r.drawn.at(-1)||'—')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" style="margin:0" onclick="action(\''+code+'\',\'start\')">Iniciar</button><button class="btn alt" style="margin:0" onclick="action(\''+code+'\',\'draw\')">Sortear pedra</button><button class="btn ghost" style="margin:0" onclick="action(\''+code+'\',\'restart\')">Reiniciar</button></div>'+myCard+'<div class="section-title"><h2>Pedidos de Bingo</h2></div>'+(requests.length?requests.map(q=>'<div class="notice"><strong>'+esc(q.name)+'</strong> · conferência automática: '+(q.valid?'válida':'inválida')+'<br><button class="btn" onclick="resolve(\''+q.id+'\',true)">Aprovar</button> <button class="btn alt" onclick="resolve(\''+q.id+'\',false)">Rejeitar</button></div>').join(''):'<p>Nenhum pedido pendente.</p>')+'</section><aside class="box"><h2>Participantes ('+players.length+')</h2>'+players.map(p=>'<p class="small">● '+esc(p.name)+(p.is_admin?' (admin)':'')+'</p>').join('')+'<h2 style="margin-top:25px">Link para participantes</h2><div class="link">'+location.origin+'/?room='+code+'</div><p class="small">Envie este link para quem vai jogar.</p><h2 style="margin-top:25px">Pedras sorteadas</h2><div class="numbers">'+renderNumbers(r.drawn)+'</div></aside></div>'}
async function action(c,x){try{await api('/rooms/'+c+'/'+x,{method:'POST',token:state.admin});adminGame(c)}catch(e){alert(e.message)}}
async function resolve(id,approve){await api('/requests/'+id+'/resolve',{method:'POST',token:state.admin,body:{approve}});adminGame(state.room.code)}
async function adminMark(n){if(!n)return;try{let x=await api('/player/mark',{method:'POST',token:state.adminPlayer.token,body:{number:n}});state.adminPlayer.player.marked=x.marked;adminGame(state.room.code)}catch(e){alert(e.message)}}
async function adminBingo(){try{let x=await api('/player/bingo',{method:'POST',token:state.adminPlayer.token,body:{}});if(!x.valid)alert('Pedido enviado, mas a conferência automática indicou que a condição ainda não foi atendida.');adminGame(state.room.code)}catch(e){alert(e.message)}}
async function join(code){try{let r=await api('/rooms/'+code);state.room=r;watch(code);if(state.player)return playerGame();app.innerHTML='<section class="box"><span class="code">'+code+'</span><h1>'+esc(r.name)+'</h1><p>Crie seu acesso ou entre novamente para receber sua cartela.</p><div class="tab"><button class="active" onclick="playerForm(\'join\')">Criar acesso</button><button onclick="playerForm(\'login\')">Entrar</button></div><div id="form"></div></section>';playerForm('join')}catch(e){app.innerHTML='<section class="box"><h1>Sala indisponível</h1><p>'+e.message+'</p></section>'}}
function playerForm(type){document.querySelector('#form').innerHTML='<form onsubmit="playerSubmit(event,\''+type+'\')">'+(type==='join'?'<label>Nome</label><input name="name" required minlength="2">':'')+'<label>E-mail</label><input name="email" type="email" required><label>Senha</label><input name="password" type="password" minlength="6" required><div class="error"></div><button class="btn">'+(type==='join'?'Criar acesso e entrar':'Entrar')+'</button></form>'}
async function playerSubmit(e,t){e.preventDefault();try{let x=await api('/rooms/'+state.room.code+'/'+t,{method:'POST',body:Object.fromEntries(new FormData(e.target))});state.player=x.token;state.me=x.player;state.room=x.room;localStorage.playerToken=x.token;playerGame()}catch(x){err(x)}}
async function playerGame(){let r=await api('/rooms/'+state.room.code);state.room=r;watch(r.code);let me=state.me;if(!me){localStorage.removeItem('playerToken');state.player=null;return join(r.code)}let c=me.cards[0],marked=me.marked||[];app.innerHTML='<div class="game"><section class="box wide game-main"><div class="game-header"><div><span class="code">SALA '+r.code+'</span><h1>'+esc(r.name)+'</h1><span class="status">'+r.status+'</span></div><div class="code">'+r.drawn.length+' / 75 pedras</div></div>'+renderCard(c,marked,'mark')+'<button class="btn alt bingo-btn" onclick="bingo()">GRITAR BINGO!</button></section><aside class="box"><h2>Última pedra</h2><div class="ball">'+(r.drawn.at(-1)||'—')+'</div><h2 style="margin-top:25px">Pedras sorteadas</h2><div class="numbers">'+renderNumbers(r.drawn)+'</div></aside></div>'}
async function mark(n){if(!n)return;try{let x=await api('/player/mark',{method:'POST',token:state.player,body:{number:n}});state.me.marked=x.marked;playerGame()}catch(e){alert(e.message)}}
async function bingo(){try{let r=await api('/player/bingo',{method:'POST',token:state.player,body:{}});if(!r.valid)alert('Pedido enviado, mas a conferência automática indicou que a condição ainda não foi atendida.');playerGame()}catch(e){alert(e.message)}}
let socket,watchedRoom=null;
function watch(c){if(socket&&watchedRoom===c)return;if(socket){socket.disconnect();socket=null}socket=io();watchedRoom=c;socket.emit('room:join',c);socket.on('room:update',({type,payload}={})=>{if(type==='bingo_requested'){showBingo(payload&&payload.name)}if(type==='restarted'){if(state.me)state.me.marked=[];if(state.adminPlayer&&state.adminPlayer.player)state.adminPlayer.player.marked=[];closeBingo()}setTimeout(()=>state.admin?adminGame(c):state.player?playerGame():null,350)})}
home();
</script>
</body>
</html>
