services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bingo:${POSTGRES_PASSWORD}@db:5432/bingo
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL: https://bingo.jornaltrade.cloud
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bingo
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bingo-db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo -d bingo"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  bingo-db:
