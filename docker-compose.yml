services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bingo:${POSTGRES_PASSWORD}@db:5432/bingo
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL: https://bingo.jornaltrade.cloud
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bingo
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bingo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo -d bingo"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  bingo-db:
