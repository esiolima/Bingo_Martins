<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar na sala · Bingo</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Outfit:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#f7f5ed;color:#172019;font-family:Outfit;min-height:100vh;display:grid;place-items:center;padding:20px}.brand{position:fixed;top:28px;left:32px;font-size:22px;font-weight:800;color:#173a2c}.brand i{font-style:normal;color:#72a33a}.card{width:100%;max-width:475px;background:#fffefa;border:1px solid #dfe4d9;border-radius:18px;padding:34px;box-shadow:0 14px 45px #18352512}.tag{font:12px 'DM Mono';background:#e7f0df;color:#376b4d;border-radius:5px;padding:6px 8px;display:inline-block}h1{font-size:29px;letter-spacing:-1px;margin:18px 0 8px}p{color:#718070;line-height:1.45}label{display:block;font-size:13px;font-weight:600;margin:15px 0 6px}input{width:100%;border:1px solid #ced8cd;border-radius:8px;padding:12px;font:14px Outfit}.button{margin-top:22px;width:100%;background:#173a2c;color:#d8f26a;border:0;border-radius:9px;padding:13px;font:600 15px Outfit;cursor:pointer}.note{font-size:12px;margin-top:16px;text-align:center}.error{color:#b13b35;background:#fff0ee;padding:9px;border-radius:7px;font-size:13px;display:none;margin-top:12px}.ok{color:#23623e;background:#e2f3cb;padding:10px;border-radius:7px;font-size:13px;display:none;margin-top:14px}.small{font:12px 'DM Mono';color:#718070}@media(max-width:500px){.brand{left:22px;top:22px}.card{padding:27px 22px;margin-top:45px}}
</style></head><body><div class="brand">BINGO<i>·</i>AO VIVO</div><main class="card" id="app"></main><script>
const qs=new URLSearchParams(location.search),code=qs.get('room'),rooms=JSON.parse(localStorage.getItem('bingoRoomsV1')||'[]'),room=rooms.find(r=>r.code===code),app=document.getElementById('app');function show(){if(!room){app.innerHTML='<span class="tag">LINK INVÁLIDO</span><h1>Esta sala não existe</h1><p>Peça ao administrador um link válido para entrar no Bingo.</p>';return}let existing=JSON.parse(localStorage.getItem('bingoParticipantsV1')||'{}')[code]||[];app.innerHTML='<span class="tag">'+code+'</span><h1>'+room.name+'</h1><p>Crie seu acesso para entrar na sala. Suas cartelas e progresso ficarão associados a esta conta.</p><form onsubmit="join(event)"><label>Seu nome</label><input id="nickname" required minlength="2" placeholder="Como os outros verão você"><label>E-mail</label><input id="email" type="email" required placeholder="voce@email.com"><label>Crie uma senha</label><input id="password" type="password" required minlength="6" placeholder="Mínimo de 6 caracteres"><div id="error" class="error"></div><button class="button">Criar acesso e entrar</button></form><div class="note">'+existing.length+' de '+room.max+' vagas preenchidas · Código seguro da sala: '+code+'</div>'}function join(e){e.preventDefault();let all=JSON.parse(localStorage.getItem('bingoParticipantsV1')||'{}'),list=all[code]||[],n=nickname.value.trim(),mail=email.value.trim().toLowerCase();let err=document.getElementById('error');if(list.length>=room.max){err.textContent='Esta sala já atingiu o limite de participantes.';err.style.display='block';return}if(list.some(p=>p.name.toLowerCase()===n.toLowerCase())){err.textContent='Este nome já está em uso nesta sala. Escolha outro.';err.style.display='block';return}if(list.some(p=>p.email===mail)){err.textContent='Este e-mail já possui acesso à sala.';err.style.display='block';return}list.push({id:crypto.randomUUID?.()||Date.now().toString(),name:n,email:mail,password:password.value,joined:new Date().toISOString()});all[code]=list;localStorage.setItem('bingoParticipantsV1',JSON.stringify(all));app.innerHTML='<span class="tag">ACESSO CRIADO</span><h1>Você entrou, '+n+'!</h1><p>Seu usuário foi criado e sua sessão está pronta. O administrador iniciará a partida em breve.</p><div class="ok" style="display:block">✓ Sua cartela será gerada ao iniciar a partida.</div><p class="small">Sala '+code+' · '+room.cards+' cartela(s) por participante</p>'}show();
</script></body></html>
